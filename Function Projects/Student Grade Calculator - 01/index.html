<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator - Function Project 01</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <form>
            <label>Name:</label>
            <input type="text" class="name">
            <label>Class:</label>
            <input type="text" class="class">

            <label>English Marks:</label>
            <input type="text" class="engMarks">

            <label>Math Marks:</label>
            <input type="text" class="mathMarks">

            <label>Computer Marks:</label>
            <input type="text" class="compMarks">

            <label>Physics Marks:</label>
            <input type="text" class="phyMarks">

            <label>Biology Marks:</label>
            <input type="text" class="bioMarks">

            <label>Chemistry Marks:</label>
            <input type="text" class="chemMarks">

        </form>
    </div>


    <script src="script.js"></script>
</body>

</html>
