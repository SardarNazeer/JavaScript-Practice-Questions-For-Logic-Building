<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    
     <section class="students">

            <div class="table-header">

                <div>

                    <h1>All Students</h1>

                    <p>Manage and view all student records</p>

                </div>

                <div class="search">

                    <input
                    type="text"
                    placeholder="Search by name...">

                    <button>
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>

                    <button>
                        <i class="fa-solid fa-plus"></i>
                        Add New Student
                    </button>

                </div>

            </div>



            <table>

                <thead>

                    <tr>

                        <th>#</th>

                        <th>Name</th>

                        <th>Math</th>

                        <th>English</th>

                        <th>Science</th>

                        <th>Computer</th>

                        <th>Urdu</th>

                        <th>Total</th>

                        <th>Percentage</th>

                        <th>Grade</th>

                        <th>Result</th>

                        <th>Actions</th>

                    </tr>

                </thead>



                <tbody>

                    <tr>

                        <td>1</td>

                        <td>Ali Hassan</td>

                        <td>95</td>

                        <td>88</td>

                        <td>92</td>

                        <td>90</td>

                        <td>85</td>

                        <td>450</td>

                        <td>90%</td>

                        <td>A+</td>

                        <td>Pass</td>

                        <td>

                            <button>
                                <i class="fa-solid fa-pen"></i>
                            </button>

                            <button>
                                <i class="fa-solid fa-trash"></i>
                            </button>

                        </td>

                    </tr>

                </tbody>

            </table>



            <div class="table-footer">

                <p>Total Students : 3</p>

                <div class="pagination">

                    <button>Previous</button>

                    <button>1</button>

                    <button>Next</button>

                </div>

            </div>

        </section>
<script src="script.js"></script>

</body>
</html>
