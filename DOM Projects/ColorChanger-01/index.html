<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Changer | 01</title>
    <style>

        body{
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .content{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .content h1{
            font-size: 30px;
            color: blue;
        }

        .content .boxes{
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .boxes .box{
            border: 2px solid white;
        }

        .boxes .box1{
            background-color: black;
            width: 100px;
            height: 100px;
        }

                .boxes .box2{
            background-color: yellow;
            width: 100px;
            height: 100px;
        }

                .boxes .box3{
            background-color: green;
            width: 100px;
            height: 100px;
        }

                .boxes .box4{
            background-color: blue;
            width: 100px;
            height: 100px;
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>Color Scheme Switcher</h1>
        <div class="boxes">
            <div class="box1 box" id="black"></div>
            <div class="box2 box" id="yellow"></div>
            <div class="box3 box" id="green"></div>
            <div class="box4 box" id="blue"></div>
        </div>
        <p>Try clicking on one of the color above to change the background color of this page.</p>
    </div>
    

    <script src="script.js"></script>
</body>
</html>
