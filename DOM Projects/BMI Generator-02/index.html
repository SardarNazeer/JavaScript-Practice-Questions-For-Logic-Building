<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMI Calculator</title>

<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #8B5E3C, #5C4033);
}

.container{
    width: 100%;
    max-width: 420px;
    background: white;
    color: #333;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

h1{
    text-align: center;
    margin-bottom: 25px;
    color: #5C4033;
}

.form-group{
    margin-bottom: 15px;
}

label{
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
}

input{
    width: 100%;
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 8px;
    outline: none;
    font-size: 16px;
}

input:focus{
    border-color: #8B5E3C;
}

button{
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #8B5E3C;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover{
    background: #6d472d;
}

#result{
    margin-top: 20px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    color: #5C4033;
}

.desc{
    margin-top: 25px;
    padding: 15px;
    background: #f5f5f5;
    border-radius: 10px;
}

.desc h3{
    margin-bottom: 10px;
    color: #5C4033;
}

.desc p{
    margin-bottom: 8px;
    font-size: 14px;
}

@media(max-width: 480px){
    .container{
        margin: 20px;
        padding: 20px;
    }
}
</style>
</head>
<body>

<div class="container">
    <h1>BMI Calculator</h1>

    <form>
        <div class="form-group">
            <label for="height">Height (CM)</label>
            <input type="number" id="height" placeholder="Enter your height">
        </div>

        <div class="form-group">
            <label for="weight">Weight (KG)</label>
            <input type="number" id="weight" placeholder="Enter your weight">
        </div>

        <button type="submit">Calculate BMI</button>
    </form>

    <div id="result"></div>

    <div class="desc">
        <h3>BMI Categories</h3>
        <p>Underweight: Less than 18.6</p>
        <p>Normal Weight: 18.6 - 24.9</p>
        <p>Overweight: Greater than 24.9</p>
    </div>
</div>

<script src="script.js"></script>


</body>
</html>
